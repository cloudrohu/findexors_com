{% extends "admin/change_list.html" %}
{% load admin_urls %}
{% load static %}

{% block extrastyle %}
{{ block.super }}

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

.crm-container{
    margin-top:20px;
}

.crm-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(420px,1fr));
    gap:20px;
}

.crm-card{
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    border:1px solid #e5e7eb;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    transition:.25s;
}

.crm-card:hover{
    transform:translateY(-3px);
}

.crm-header{
    padding:20px;
    border-bottom:1px solid #eee;
}

.crm-title{
    font-size:19px;
    font-weight:800;
    color:#111827;
}

.crm-meta{
    margin-top:6px;
    font-size:13px;
    color:#4b5563;
}

.crm-badge{
    display:inline-block;
    padding:5px 12px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
    margin-right:6px;
    margin-top:8px;
}

.blue{
    background:#DBEAFE;
    color:#1D4ED8;
}

.green{
    background:#DCFCE7;
    color:#166534;
}

.red{
    background:#FEE2E2;
    color:#B91C1C;
}

.orange{
    background:#FFEDD5;
    color:#C2410C;
}

.gray{
    background:#F3F4F6;
    color:#111827;
}

.section{
    padding:18px;
    border-bottom:1px solid #eee;
}

.section-title{
    font-weight:800;
    margin-bottom:12px;
    color:#111827;
}

.row{
    margin-bottom:7px;
    font-size:13px;
}

.actions{
    padding:18px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.btn{
    padding:10px 16px;
    border-radius:999px;
    color:#fff;
    text-decoration:none;
    font-size:12px;
    font-weight:700;
}

.call{
    background:#16A34A;
}

.whatsapp{
    background:#25D366;
}

.edit{
    background:#111827;
}

.open{
    background:#2563EB;
}

@media(max-width:640px){

.crm-grid{
grid-template-columns:1fr;
}

.btn{
flex:1;
text-align:center;
}

}

</style>

{% endblock %}
