{% extends "admin/change_list.html" %}
{% load admin_urls %}
{% load static %}

{% block extrastyle %}
{{ block.super }}

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

.crm-container{
    margin-top:20px;
}

.crm-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
    gap:20px;
}

.crm-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    transition:.25s ease;
    display:flex;
    flex-direction:column;
}

.crm-card:hover{
    transform:translateY(-3px);
}

.crm-header{
    display:flex;
    align-items:center;
    gap:16px;
    padding:20px;
    border-bottom:1px solid #eef2f7;
}

.crm-logo{
    width:55px;
    height:55px;
    border-radius:12px;
    overflow:hidden;
    background:#f3f4f6;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.crm-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.crm-logo span{
    font-size:28px;
}

.crm-info{
    flex:1;
}

.crm-title{
    font-size:18px;
    font-weight:800;
    color:#111827;
}

.crm-meta{
    margin-top:6px;
    font-size:13px;
    color:#6b7280;
    line-height:1.7;
}

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:10px;
}

.crm-badge{
    display:inline-block;
    padding:5px 12px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
}

.blue{
    background:#DBEAFE;
    color:#1D4ED8;
}

.green{
    background:#DCFCE7;
    color:#166534;
}

.orange{
    background:#FED7AA;
    color:#C2410C;
}

.red{
    background:#FEE2E2;
    color:#991B1B;
}

.gray{
    background:#F3F4F6;
    color:#374151;
}

.section{
    padding:18px;
    border-top:1px solid #eef2f7;
}

.section:first-child{
    border-top:none;
}

.section-title{
    font-size:15px;
    font-weight:700;
    color:#111827;
    margin-bottom:12px;
}

.row{
    margin-bottom:8px;
    font-size:13px;
    color:#374151;
    line-height:1.7;
}

.timeline-box,
.followup-box,
.meeting-box,
.voice-box{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:14px;
    margin-top:12px;
}

.followup-box{
    border-left:4px solid #f59e0b;
}

.meeting-box{
    border-left:4px solid #2563eb;
}

.voice-box{
    border-left:4px solid #92400e;
}

.timeline-box{
    border-left:4px solid #7c3aed;
}

.actions{
    margin-top:auto;
    padding:18px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.actions a{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-width:135px;
    padding:10px 16px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    text-decoration:none;
    color:#fff;
    transition:.25s;
}

.actions a:hover{
    transform:translateY(-2px);
    color:#fff;
}

.actions i{
    font-size:15px;
}

.call{
    background:#16a34a;
}

.call:hover{
    background:#15803d;
}

.whatsapp{
    background:#25D366;
}

.whatsapp:hover{
    background:#1faa52;
}

.website{
    background:#2563eb;
}

.website:hover{
    background:#1d4ed8;
}

.map{
    background:#7c3aed;
}

.map:hover{
    background:#6d28d9;
}

.edit{
    background:#111827;
}

.edit:hover{
    background:#000;
}

.response{
    background:#0891b2;
}

.response:hover{
    background:#0e7490;
}

.company{
    background:#7c3aed;
}

.company:hover{
    background:#6d28d9;
}

.realestate{
    background:#ea580c;
}

.realestate:hover{
    background:#c2410c;
}

audio{
    width:100%;
}

@media(max-width:768px){

    .crm-grid{
        grid-template-columns:1fr;
    }

    .crm-header{
        align-items:flex-start;
    }

    .actions{
        flex-direction:column;
    }

    .actions a{
        width:100%;
        min-width:unset;
    }

}

</style>

{% endblock %}


{% block result_list %}

<div class="crm-container">

<div class="crm-grid">

{% for obj in cl.result_list %}

<!-- Card Start -->

<div class="crm-card">

{% block card_content %}

{% endblock %}

</div>

<!-- Card End -->

{% endfor %}

</div>

</div>

{% endblock %}
