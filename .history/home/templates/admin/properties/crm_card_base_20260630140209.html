{% extends "admin/change_list.html" %}
{% load admin_urls %}
{% load static %}

{% block extrastyle %}
{{ block.super }}

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    /* ===========================
   Layout
=========================== */

.crm-container{
    margin-top:20px;
}

.crm-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
    gap:20px;
}

.crm-card{
    display:flex;
    flex-direction:column;
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    transition:.25s ease;
}

.crm-card:hover{
    transform:translateY(-3px);
}


/* ===========================
   Header
=========================== */

.crm-header{
    display:flex;
    gap:18px;
    align-items:center;
    padding:20px;
    border-bottom:1px solid #eef2f7;
}

.crm-logo{
    width:55px;
    height:55px;
    border-radius:14px;
    overflow:hidden;
    background:#f3f4f6;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.crm-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.crm-logo span{
    font-size:28px;
}

.crm-info{
    flex:1;
}

.crm-title{
    font-size:18px;
    font-weight:800;
    color:#111827;
}

.crm-meta{
    margin-top:6px;
    color:#64748b;
    font-size:13px;
    line-height:1.7;
}


/* ===========================
   Badges
=========================== */

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:10px;
}

.crm-badge{
    display:inline-block;
    padding:5px 12px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
}

.blue{
    background:#DBEAFE;
    color:#1D4ED8;
}

.green{
    background:#DCFCE7;
    color:#166534;
}

.orange{
    background:#FED7AA;
    color:#C2410C;
}

.red{
    background:#FEE2E2;
    color:#991B1B;
}

.gray{
    background:#F3F4F6;
    color:#374151;
}


/* ===========================
   Common Section
=========================== */

.section{
    padding:18px;
    border-top:1px solid #eef2f7;
}

.section:first-child{
    border-top:none;
}

.section-title{
    margin-bottom:12px;
    font-size:15px;
    font-weight:800;
    color:#111827;
}

.row{
    margin-bottom:8px;
    color:#374151;
    font-size:13px;
    line-height:1.7;
}


/* ===========================
   Information Box
=========================== */

.info-box{
    background:#f8fafc;
    border-left:4px solid #ec4899;
    border-radius:12px;
    padding:14px;
}

.info-box .row{
    margin:10px 0;
}

.info-footer{
    margin-top:12px;
    padding-top:10px;
    border-top:1px dashed #d1d5db;
    font-size:12px;
    color:#64748b;
}


/* ===========================
   CRM Boxes
=========================== */

.timeline-box,
.followup-box,
.meeting-box,
.voice-box{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:14px;
    margin-top:12px;
}

.timeline-box{
    border-left:4px solid #7c3aed;
}

.followup-box{
    border-left:4px solid #f59e0b;
}

.meeting-box{
    border-left:4px solid #2563eb;
}

.voice-box{
    border-left:4px solid #92400e;
}
</style>
{% endblock %}


{% block result_list %}

<div class="crm-container">

<div class="crm-grid">

{% for obj in cl.result_list %}

<!-- Card Start -->

<div class="crm-card">

{% block card_content %}

{% endblock %}

</div>

<!-- Card End -->

{% endfor %}

</div>

</div>

{% endblock %}
