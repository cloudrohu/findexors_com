<div class="header">

    <div class="logo">

        {% if obj.image %}
            <img src="{{ obj.image.url }}">
        {% else %}
            <span>🏢</span>
        {% endif %}

    </div>

    <div class="info">

        <div class="badges">

            <span class="badge blue">
                PRO{{ obj.id|stringformat:"03d" }}
            </span>

            {% if obj.featured_property %}
                <span class="badge green">
                    ⭐ Featured
                </span>
            {% endif %}

            {% if obj.active %}
                <span class="badge success">
                    Active
                </span>
            {% else %}
                <span class="badge danger">
                    Inactive
                </span>
            {% endif %}

        </div>

        <div class="title">
            {{ obj.project_name }}
        </div>

        <div class="meta">
            🏗 {{ obj.developer }}
        </div>

    </div>

</div>
