{% extends "admin/change_list.html" %}
{% load admin_urls %}
{% load static %}

{% block extrastyle %}
{{ block.super }}

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    /* ===========================
   Layout
=========================== */

.crm-container{
    margin-top:20px;
}

.crm-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
    gap:20px;
}

.crm-card{
    display:flex;
    flex-direction:column;
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    transition:.25s ease;
}

.crm-card:hover{
    transform:translateY(-3px);
}


/* ===========================
   Header
=========================== */

.crm-header{
    display:flex;
    gap:18px;
    align-items:center;
    padding:20px;
    border-bottom:1px solid #eef2f7;
}

.crm-logo{
    width:55px;
    height:55px;
    border-radius:14px;
    overflow:hidden;
    background:#f3f4f6;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.crm-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.crm-logo span{
    font-size:28px;
}

.crm-info{
    flex:1;
}

.crm-title{
    font-size:18px;
    font-weight:800;
    color:#111827;
}

.crm-meta{
    margin-top:6px;
    color:#64748b;
    font-size:13px;
    line-height:1.7;
}


/* ===========================
   Badges
=========================== */

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:10px;
}

.crm-badge{
    display:inline-block;
    padding:5px 12px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
}

.blue{
    background:#DBEAFE;
    color:#1D4ED8;
}

.green{
    background:#DCFCE7;
    color:#166534;
}

.orange{
    background:#FED7AA;
    color:#C2410C;
}

.red{
    background:#FEE2E2;
    color:#991B1B;
}

.gray{
    background:#F3F4F6;
    color:#374151;
}


/* ===========================
   Common Section
=========================== */

.section{
    padding:18px;
    border-top:1px solid #eef2f7;
}

.section:first-child{
    border-top:none;
}

.section-title{
    margin-bottom:12px;
    font-size:15px;
    font-weight:800;
    color:#111827;
}

.row{
    margin-bottom:8px;
    color:#374151;
    font-size:13px;
    line-height:1.7;
}


/* ===========================
   Information Box
=========================== */

.info-box{
    background:#f8fafc;
    border-left:4px solid #ec4899;
    border-radius:12px;
    padding:14px;
}

.info-box .row{
    margin:10px 0;
}

.info-footer{
    margin-top:12px;
    padding-top:10px;
    border-top:1px dashed #d1d5db;
    font-size:12px;
    color:#64748b;
}


/* ===========================
   CRM Boxes
=========================== */

.timeline-box,
.followup-box,
.meeting-box,
.voice-box{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:14px;
    margin-top:12px;
}

.timeline-box{
    border-left:4px solid #7c3aed;
}

.followup-box{
    border-left:4px solid #f59e0b;
}

.meeting-box{
    border-left:4px solid #2563eb;
}

.voice-box{
    border-left:4px solid #92400e;
}

/* ===========================
   Statistics
=========================== */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.stat{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:14px;
    text-align:center;
}

.stat-number{
    font-size:24px;
    font-weight:800;
    color:#111827;
}

.stat-title{
    margin-top:5px;
    font-size:11px;
    color:#64748b;
}


/* ===========================
   Actions
=========================== */

.actions{
    margin-top:auto;
    padding:18px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.actions a{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    min-width:135px;

    padding:10px 16px;

    border-radius:999px;

    text-decoration:none;

    color:#fff;

    font-size:13px;
    font-weight:700;

    transition:.25s ease;
}

.actions a:hover{
    transform:translateY(-2px);
    color:#fff;
}

.actions i{
    font-size:15px;
}


/* ===========================
   Button Colors
=========================== */

.call{
    background:#16a34a;
}

.call:hover{
    background:#15803d;
}

.whatsapp{
    background:#25D366;
}

.whatsapp:hover{
    background:#1faa52;
}

.website{
    background:#2563eb;
}

.website:hover{
    background:#1d4ed8;
}

.map{
    background:#7c3aed;
}

.map:hover{
    background:#6d28d9;
}

.project{
    background:#ea580c;
}

.project:hover{
    background:#c2410c;
}

.followup{
    background:#0891b2;
}

.followup:hover{
    background:#0e7490;
}

.meeting{
    background:#2563eb;
}

.meeting:hover{
    background:#1d4ed8;
}

.comment{
    background:#4338ca;
}

.comment:hover{
    background:#3730a3;
}

.visit{
    background:#059669;
}

.visit:hover{
    background:#047857;
}

.voice{
    background:#92400e;
}

.voice:hover{
    background:#78350f;
}

.edit{
    background:#111827;
}

.edit:hover{
    background:#000;
}


/* ===========================
   Links
=========================== */

a{
    transition:.25s;
}

.crm-card a{
    text-decoration:none;
}

.crm-card a:hover{
    text-decoration:none;
}


/* ===========================
   Audio
=========================== */

audio{
    width:100%;
    margin-top:10px;
}


/* ===========================
   Divider
=========================== */

hr{
    margin:12px 0;
    border:none;
    border-top:1px dashed #d1d5db;
}


/* ===========================
   Empty Message
=========================== */

.empty{
    color:#9ca3af;
    font-size:13px;
    font-style:italic;
}


/* ===========================
   Responsive
=========================== */

@media (max-width:768px){

    .crm-grid{
        grid-template-columns:1fr;
    }

    .crm-header{
        align-items:flex-start;
    }

    .crm-logo{
        width:48px;
        height:48px;
    }

    .crm-title{
        font-size:16px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .actions{
        flex-direction:column;
    }

    .actions a{
        width:100%;
        min-width:unset;
    }

}

@media (max-width:480px){

    .stats{
        grid-template-columns:1fr;
    }

    .crm-header{
        gap:12px;
    }

    .crm-logo{
        width:42px;
        height:42px;
    }

    .crm-title{
        font-size:15px;
    }

    .crm-meta,
    .row{
        font-size:12px;
    }

}
</style>
{% endblock %}


{% block result_list %}

<div class="crm-container">

<div class="crm-grid">

{% for obj in cl.result_list %}

<!-- Card Start -->

<div class="crm-card">

{% block card_content %}

{% endblock %}

</div>

<!-- Card End -->

{% endfor %}

</div>

</div>

{% endblock %}
