<style>
/* ===============================
   🔥 CLEAN PREMIUM ADMIN CARD CSS
   =============================== */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(500px,1fr));
    gap:22px;
    margin-top:20px;
}

/* Card */
.card{
    background:#ffffff;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(15,23,42,.08);
    padding:22px;
    border:1px solid #f1f5f9;
    transition:all .25s ease;
}
.card:hover{
    transform:translateY(-4px);
    box-shadow:0 18px 40px rgba(15,23,42,.12);
}

/* Header */
.header{
    display:flex;
    gap:16px;
}

/* Avatar */
.avatar{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#eef2ff;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid #e0e7ff;
    flex-shrink:0;
}
.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Title Section */
.title-wrap{
    flex:1;
}
.title-line{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}
.main-title{
    font-size:18px;
    font-weight:800;
    color:#0f172a;
}

/* Subline */
.subline{
    margin-top:6px;
    font-size:13px;
    color:#64748b;
    display:flex;
    gap:14px;
    flex-wrap:wrap;
}

/* Badges */
.badge{
    padding:6px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    gap:5px;
    line-height:1;
}

.badge.green{background:#dcfce7;color:#166534;}
.badge.blue{background:#dbeafe;color:#1d4ed8;}
.badge.yellow{background:#fef3c7;color:#854d0e;}
.badge.gray{background:#f3f4f6;color:#111827;}
.badge.red{background:#fee2e2;color:#991b1b;}

/* Divider */
.hr{
    border:none;
    border-top:1px solid #e5e7eb;
    margin:18px 0;
}

/* Info Rows */
.row{
    display:grid;
    gap:8px;
    font-size:14px;
    color:#334155;
    margin-top:8px;
}
.row .item{
    display:flex;
    gap:6px;
    align-items:center;
}
.row strong{
    color:#0f172a;
}

/* Detail Block */
.block{
    margin-top:14px;
    padding:14px 16px;
    border-radius:16px;
    border:1px solid #e5e7eb;
    background:#f9fafb;
}
.block-title{
    font-weight:800;
    margin-bottom:10px;
    color:#0f172a;
}

/* Actions */
.actions{
    margin-top:18px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}
.actions a{
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:8px;
    transition:all .2s ease;
}

.call-btn{
    background:#0f766e;
    color:#fff;
}
.call-btn:hover{
    background:#115e59;
}

.whatsapp-btn{
    background:#22c55e;
    color:#fff;
}
.whatsapp-btn:hover{
    background:#16a34a;
}

.edit-btn{
    background:#ffffff;
    border:1px solid #e5e7eb;
    color:#0f172a;
}
.edit-btn:hover{
    background:#f1f5f9;
}

/* ===============================
   📱 MOBILE FIX
   =============================== */

@media (max-width:640px){

    .cards{
        grid-template-columns:1fr;
        gap:16px;
        padding:0 4px;
    }

    .card{
        padding:16px;
        border-radius:16px;
    }

    .avatar{
        width:50px;
        height:50px;
    }

    .main-title{
        font-size:16px;
    }

    .actions a{
        flex:1;
        justify-content:center;
    }

    #content{
        padding:12px !important;
    }

    .results,
    #container{
        overflow-x:hidden !important;
    }
}
</style>
